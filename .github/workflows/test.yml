name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test
      - name: Retrieval evaluation
        run: npm run eval
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser journey
        run: npm run test:e2e
