services:
  - type: web
    name: documind
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Render sits behind a proxy: read the visitor's address from X-Forwarded-For for the rate limit.
      - key: TRUST_PROXY
        value: "true"
      # Optional. Without it the app runs in extractive mode (no text is generated).
      - key: GEMINI_API_KEY
        sync: false
      # Optional. Tried when the main model keeps answering 503 or 429.
      - key: GEMINI_FALLBACK_MODEL
        sync: false
